[package]
name = "wrk-md"
description = "Standalone terminal markdown viewer (pager) built on the wrk-markdown renderer."
version = "0.1.10" # x-release-please-version
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "wrk-md"
path = "src/main.rs"

[features]
default = ["highlight", "images"]
highlight = ["wrk-markdown/highlight"]
# Render image links as terminal graphics (kitty/sixel/iterm2, half-block
# fallback) incl. SVG. On by default — images are core to a viewer — but can be
# dropped with `--no-default-features` to shed the resvg/graphics stack.
images = ["wrk-markdown/images"]

[dependencies]
wrk-markdown = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
