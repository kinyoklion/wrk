[package]
name = "wrk-markdown"
description = "CommonMark/GFM markdown rendering into ratatui text plus a scrollable view widget, used by the wrk TUI and the wrk-md standalone viewer."
version = "0.1.16" # x-release-please-version
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["highlight"]
# Syntax-highlight fenced code blocks via syntect (pure-Rust fancy-regex engine,
# no C/oniguruma). When off, code blocks render as plain dimmed text.
highlight = ["dep:syntect"]
# Render image links (`![](x.png|jpg|svg)`) as real terminal graphics
# (kitty/sixel/iterm2, half-block fallback) via ratatui-image. SVG is
# rasterized with resvg using a bundled Liberation Sans, so `<text>` renders
# without relying on system fonts. Off by default (pulls resvg/tiny-skia and a
# terminal-graphics stack, and raises the MSRV to 1.86); the `wrk` and `wrk-md`
# binaries opt in.
images = ["dep:ratatui-image", "dep:image", "dep:resvg", "dep:ttf-parser"]
# Render ```mermaid``` fences as real diagrams. carcimaid (pure-Rust) turns the
# mermaid source into SVG, which flows through the same resvg rasterizer as any
# other SVG image, so this implies `images`. When off, the default `NullBackend`
# shows the fence source with a hint. On a parse error the backend falls back to
# that same source dump, so a bad diagram never breaks the document.
mermaid = ["images", "dep:carcimaid"]

[dependencies]
ratatui = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"], optional = true }
# Terminal image protocols. default-features off to avoid `chafa-dyn` (which
# dynamically links the C lib libchafa) — we keep the stack pure-Rust, matching
# syntect's fancy-regex choice. `crossterm` selects the backend wrk/wrk-md use;
# raster decoding comes from our own `image` dep below. resvg re-exports usvg +
# tiny-skia + fontdb, so a single dep covers SVG parse → rasterize → font DB.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
resvg = { version = "0.45", optional = true }
# Measure heading text against the bundled font so heading-image SVGs are sized
# tightly (long headings scale to fit rather than clip). Pure-Rust; the same
# major version resvg/usvg already pull in.
ttf-parser = { version = "0.25", optional = true }
# Pure-Rust mermaid → SVG renderer. Not on crates.io; pinned to a release tag
# and fetched over HTTPS so no SSH auth is needed. Its in-repo `roughr` path dep
# resolves inside the git clone.
carcimaid = { git = "https://github.com/kinyoklion/carcimaid.git", tag = "carcimaid-v0.1.5", optional = true }
