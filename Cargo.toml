[package]
name = "wrk"
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[[bin]]
name = "wrk"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26"
vte = { version = "0.15", default-features = false, features = ["std", "ansi"] }
portable-pty = "0.9"
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
notify = "8"
nucleo-matcher = "0.3"
directories = "6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
